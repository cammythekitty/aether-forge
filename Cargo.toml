[package]
name = "aether-forge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aether-forge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
git2 = "0.19"
clap = { version = "4", features = ["derive"] }
colored = "2"